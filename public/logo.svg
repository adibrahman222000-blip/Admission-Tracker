<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" role="img" aria-labelledby="title desc">
  <title id="title">Admission Tracker</title>
  <desc id="desc">A neon academic compass mark with an open book and a rising path.</desc>
  <defs>
